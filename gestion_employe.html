<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        label{
            font-size: larger;
        }
    </style>
</head>
<body>
    <div class="container m-4 p-3 mx-auto bg-light">
        <form action="">
            <div class="roz"><div class="col"><input type="text" id="search" placeholder="look for" class="form-control"></div></div>
            <div class="row">
                <div class="col"><label for="nom">Nom</label></div>
                <div class="col"><label for="email">Email</label></div>
            </div><br>
            <div class="row">
                <div class="col"><input type="text" id="nom" placeholder="write name" class="form-control"></div>
                <div class="col"><input type="email" id="email" placeholder="write email" class="form-control"></div>
            </div><br>
            <div class="row">
                <div class="col"><label for="dep">Département</label></div>
                <div class="col"><label for="genre">Genre</label></div>
            </div><br>
            <div class="row">
                <div class="col">
                    <select name="" id="dep" class="form-control">
                        <option value="0" selected disabled>-- choisir departement --</option>
                        <option value="finance">Finance</option>
                        <option value="marketing">Marketing</option>
                        <option value="it">IT</option>
                        <option value="rh">RH</option>
                    </select>
                </div><br>
                <div class="col"><input type="radio" checked name="sex" value="femme">Femme &nbsp;&nbsp;<input type="radio" name="sex" value="homme">Homme
                </div><br><br>
                <div class="row">
                    <div class="col"><label for="comp">Competences</label></div>
                    <div class="col">
                        <div>
                            <input type="checkbox" value="HTML">HTML &nbsp;&nbsp;&nbsp;
                            <input type="checkbox" value="CSS">CSS &nbsp;&nbsp;&nbsp;
                            <input type="checkbox" value="JAVASCRIPT">JAVASCRIPT
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row">
            <div class="col d-flex justify-content-end"><button type="button" id="butn" class="btn btn-outline-primary">Ajouter Employé</button></div>
        </div>
        <table class="table table-bordered">
            <thead>
                <th>Name</th>
                <th>Email</th>
                <th>Departement</th>
                <th>Genre</th>
                <th>Competences</th>
                <th>Actions</th>
            </thead>
            <tbody id="body"></tbody>
        </table>
    </div>
    <script>
        //LOCAL-------STORAGE
        let employees = JSON.parse(localStorage.getItem('employees')) || [];

        function saveData() {
            localStorage.setItem('employees', JSON.stringify(employees));
            renderTable();
        }
        function renderTable(){
            let body = document.querySelector('#body');
            body.innerHTML = '';

            employees.forEach(function(emp, index){
            let tr=document.createElement('tr');
            tr.innerHTML=`<td>${emp.name}</td><td>${emp.em}</td><td>${emp.dep}</td><td>${emp.ger}</td><td>${emp.skills}</td>`;

            //-----button delete
            let td=document.createElement('td');
            let del=document.createElement('button');
            del.textContent='delete';
            
            del.addEventListener('click', function(){
                employees.splice(index, 1);
                saveData();
            });
            //-----button edit
            let edit=document.createElement('button');
            edit.textContent='modify';
            
            edit.addEventListener('click', function(){
                let new_name=prompt("saisir new name");
                let new_email=prompt("saisir new email");
                let new_dep=prompt("saisir new departement");
                let new_genre=prompt("saisir new genre");
                let new_comp=prompt("saisir new competence (separe par vergule)");
                employees[index] = {
                    name: new_name || emp.name,
                    em: new_email || emp.em,
                    dep: new_dep || emp.dep,
                    ger: new_genre || emp.ger,
                    skills: new_comp ? new_comp.split(",") : emp.skills
                };
                saveData();
            });

            td.append(del, edit);
            tr.appendChild(td);
            body.append(tr);
        });}

        document.querySelector('#butn').addEventListener('click', function(){
            let name=document.querySelector('#nom').value;
            let em=document.querySelector('#email').value;
            let dep=document.querySelector('#dep').value;
            let ger=document.querySelector('input[name="sex"]:checked').value;
            let cmpts=document.querySelectorAll('input[type=checkbox]:checked');
            let skills=[];
            cmpts.forEach(function(cmpt){
                skills.push(cmpt.value)
            })
            let emp = { name, em, dep, ger, skills };
            employees.push(emp);
            saveData(); 
        });
        renderTable()




        let size = 5;
for (let i = 0; i < size; i++) {
    let row = "";
    for (let j = 0; j < size; j++) {
        row += "* ";
    }
    console.log(row);
}
    </script>
</body>
</html>
